name: Render Evaluation Map

on:
  push:
    branches:
      - render-evaluation-map-20260827
    paths-ignore:
      - 'deliveries/**'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: render-evaluation-map-20260827

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install CJK fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f -v >/dev/null

      - name: Typecheck
        run: npm run typecheck

      - name: Render MP4 and QC stills
        run: |
          mkdir -p deliveries
          npx remotion render src/evaluation-map-index.tsx EvaluationMap deliveries/evaluation-map.mp4 --codec=h264 --crf=18
          for frame in 30 105 165 225 360 430 520 590 650 688; do
            npx remotion still src/evaluation-map-index.tsx EvaluationMap "deliveries/qc-${frame}.png" --frame="$frame"
          done
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -of default=noprint_wrappers=1 deliveries/evaluation-map.mp4

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-map-${{ github.run_id }}
          path: deliveries/
          if-no-files-found: error
          retention-days: 7

      - name: Commit render for review handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliveries/
          if git diff --cached --quiet; then
            echo "No render changes to commit"
          else
            git commit -m "chore: render evaluation map [skip ci]"
            git push origin HEAD:render-evaluation-map-20260827
          fi
