name: Render Remotion

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Remotion composition ID
        required: true
        default: BentoGrid
  push:
    branches:
      - render-cf-evolution

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck CyberFish changes
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          set -e
          if grep -E 'src/(projects/cyberfish|cyberfish-index\.tsx)' /tmp/typecheck.log; then
            echo 'CyberFish type errors found.'
            exit 1
          fi
          echo 'No CyberFish type errors. Existing unrelated repository diagnostics are not blockers for this isolated render.'

      - name: Render MP4
        run: |
          mkdir -p out/stills
          npx remotion render src/cyberfish-index.tsx CyberFishEvolution out/render.mp4 --codec=h264 --crf=17

      - name: Render QC stills
        run: |
          npx remotion still src/cyberfish-index.tsx CyberFishEvolution out/stills/00.png --frame=0
          npx remotion still src/cyberfish-index.tsx CyberFishEvolution out/stills/05.png --frame=150
          npx remotion still src/cyberfish-index.tsx CyberFishEvolution out/stills/09.png --frame=270
          npx remotion still src/cyberfish-index.tsx CyberFishEvolution out/stills/10.png --frame=300
          npx remotion still src/cyberfish-index.tsx CyberFishEvolution out/stills/14.png --frame=420
          npx remotion still src/cyberfish-index.tsx CyberFishEvolution out/stills/17.png --frame=510
          npx remotion still src/cyberfish-index.tsx CyberFishEvolution out/stills/18.png --frame=540
          npx remotion still src/cyberfish-index.tsx CyberFishEvolution out/stills/20.png --frame=600
          npx remotion still src/cyberfish-index.tsx CyberFishEvolution out/stills/22.png --frame=660
          npx remotion still src/cyberfish-index.tsx CyberFishEvolution out/stills/27.png --frame=810

      - name: Upload render and QC
        uses: actions/upload-artifact@v4
        with:
          name: cyberfish-evolution-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 7
